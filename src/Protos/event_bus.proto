syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Solace.EventBus";

package eventbus;

service EventBusService {
    rpc Publish (PublishRequest) returns (PublishResponse);
    rpc Subscribe (SubscribeRequest) returns (stream EventMessage);
    
    rpc Request (RequestMessage) returns (ResponseMessage);
    rpc HandleRequests (stream ClientMessage) returns (stream ServerMessage);
}

message PublishRequest {
    string queue_name = 1;
    string type = 2;
    string data = 3;
}

message PublishResponse {
    bool success = 1;
}

message SubscribeRequest {
    string queue_name = 1;
}

message EventMessage {
    string type = 1;
    string data = 2;
    google.protobuf.Timestamp timestamp = 3;
}

message RequestMessage {
    string queue_name = 1;
    string type = 2;
    string data = 3;
}

message ResponseMessage {
    string data = 1;
    Status status = 2;
    string error_message = 3;

    enum Status
    {
        Success = 0;
        NoHandlers = 1;
        HandlerError = 2;
        ServerError = 3;
    }
}

message ClientMessage {
    oneof payload {
        string register_queue = 1;
        HandlerResponse response = 2;
    }
}

message HandlerResponse {
    string correlation_id = 1;
    string data = 2;
    Status status = 3;

    enum Status {
        Success = 0;
        NotHandled = 1;
        Error = 2;
    }
}

message ServerMessage {
    string correlation_id = 1;
    string type = 2;
    string data = 3;
    google.protobuf.Timestamp timestamp = 4;
}